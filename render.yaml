services:
  - type: web
    name: sistema-moeda-estudantil-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /tmp/moeda_estudantil.db
